name: Remove "Ready for Release" label on close

on:
  issues:
    types: [closed]

jobs:
  remove-label:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'Ready for Release')
    permissions:
      issues: write

    steps:
      - name: Remove the label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'Ready for Release',
            });
            core.info(
              `Removed "Ready for Release" from issue #${context.issue.number}.`,
            );
